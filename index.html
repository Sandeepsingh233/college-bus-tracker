<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Bus Tracking System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 font-sans">

    <!-- ==================== LOGIN SECTION ==================== -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
            <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Portal Login</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Select Role</label>
                    <select id="roleSelect" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500">
                        <option value="student">Student</option>
                        <option value="driver">Driver</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username / ID</label>
                    <input type="text" id="usernameInput" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500" placeholder="Enter username">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="passwordInput" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-lg hover:bg-indigo-700 transition duration-200">Sign In</button>
            </form>
        </div>
    </div>

    <!-- ==================== ADMIN DASHBOARD ==================== -->
    <div id="adminDashboard" style="display: none;" class="min-h-screen p-6 bg-gray-50">
        <div class="max-w-4xl mx-auto space-y-6">
            <!-- Header -->
            <div class="flex justify-between items-center bg-white p-6 rounded-xl shadow-md">
                <h1 class="text-2xl font-bold text-gray-800">Admin Control Panel</h1>
                <button onclick="location.reload()" class="bg-red-500 text-white px-4 py-2 rounded-lg font-semibold hover:bg-red-600 text-sm">Logout</button>
            </div>
            
            <!-- Add User Form -->
            <form id="addUserForm" onsubmit="addNewUser(event)" class="space-y-4 bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-lg font-semibold text-gray-700 border-b pb-2">Create New Driver / Student Account</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Account Type</label>
                        <select id="newRole" class="w-full border border-gray-300 rounded-lg p-2.5">
                            <option value="driver">Driver</option>
                            <option value="student">Student</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Full Name</label>
                        <input type="text" id="newName" required class="w-full border border-gray-300 rounded-lg p-2.5" placeholder="e.g. Rahul Kumar">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Username / ID</label>
                        <input type="text" id="newUsername" required class="w-full border border-gray-300 rounded-lg p-2.5" placeholder="e.g. driver_01">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="newPassword" required class="w-full border border-gray-300 rounded-lg p-2.5" placeholder="Set password">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700">Assigned Route</label>
                        <input type="text" id="newRoute" required class="w-full border border-gray-300 rounded-lg p-2.5" placeholder="e.g. Route 12 - Campus to City Center">
                    </div>
                </div>
                <button type="submit" class="w-full bg-green-600 text-white font-semibold py-2.5 rounded-lg hover:bg-green-700 transition">Create User</button>
            </form>

            <!-- Live Users & Routes Table -->
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Registered Users & Routes</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-gray-700 text-sm">
                                <th class="p-3 border-b">Role</th>
                                <th class="p-3 border-b">Name</th>
                                <th class="p-3 border-b">Username</th>
                                <th class="p-3 border-b">Password</th>
                                <th class="p-3 border-b">Assigned Route</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <tr>
                                <td colspan="5" class="p-4 text-center text-gray-500">Loading users...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== DRIVER DASHBOARD ==================== -->
    <div id="driverDashboard" style="display: none;" class="min-h-screen p-6 bg-gray-50 flex items-center justify-center">
        <div class="max-w-md w-full bg-white p-6 rounded-xl shadow-md text-center">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">Driver Broadcast Panel</h1>
            <div class="space-y-3 bg-gray-100 p-4 rounded-lg mb-6 text-left text-sm font-mono text-gray-700">
                <p><strong>Latitude:</strong> <span id="latDisplay">0.0000</span></p>
                <p><strong>Longitude:</strong> <span id="lngDisplay">0.0000</span></p>
                <p><strong>Speed:</strong> <span id="speedDisplay">0.0 km/h</span></p>
            </div>
            <div class="space-y-3">
                <button id="startBtn" class="w-full bg-green-600 text-white font-semibold py-2.5 rounded-lg hover:bg-green-700">Start Broadcast</button>
                <button id="stopBtn" class="w-full bg-red-600 text-white font-semibold py-2.5 rounded-lg hover:bg-red-700">Stop Broadcast</button>
                <button onclick="location.reload()" class="w-full bg-gray-600 text-white font-semibold py-2.5 rounded-lg hover:bg-gray-700 mt-4">Logout</button>
            </div>
        </div>
    </div>

    <!-- ==================== STUDENT DASHBOARD ==================== -->
    <div id="studentDashboard" style="display: none;" class="min-h-screen flex flex-col">
        <header class="bg-indigo-600 text-white p-4 flex justify-between items-center shadow-md">
            <h1 class="text-xl font-bold">Live Bus Tracking</h1>
            <button onclick="location.reload()" class="bg-red-500 px-3 py-1 rounded text-sm font-semibold hover:bg-red-600">Logout</button>
        </header>
        <div id="map" class="flex-grow w-full h-[calc(100vh-64px)]"></div>
    </div>

    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <!-- Main JS File -->
    <script src="script.js"></script>
</body>
</html>
